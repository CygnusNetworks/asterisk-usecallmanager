name: Create GitHub Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Compute image names
        run: |
          TAG="${GITHUB_REF_NAME}"
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          DOCKER_USER_LC=$(echo "${{ secrets.DOCKER_USERNAME }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME_LC=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "GHCR_IMAGE=ghcr.io/${REPO_LC}:${TAG}" >> "$GITHUB_ENV"
          echo "DOCKERHUB_IMAGE=${DOCKER_USER_LC}/${REPO_NAME_LC}:${TAG}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          body: |
            ## Docker Image

            ```
            docker pull ${{ env.DOCKERHUB_IMAGE }}
            ```

            Alternative (GitHub Container Registry):
            ```
            docker pull ${{ env.GHCR_IMAGE }}
            ```
          generate_notes: true
          make_latest: true
